name: Deploy to GitHub Pages

on:
  push:
    branches: [trunk]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            games/package-lock.json

      # Build GDevelop example games into site/static/arcade/games/
      - name: Install game build dependencies
        working-directory: games
        run: npm ci

      - name: Build example games
        working-directory: games
        run: node build-games.mjs

      # Build the Docusaurus site (includes built games in static/)
      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
