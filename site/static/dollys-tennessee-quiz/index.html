<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#26153e" />
    <title>Dolly’s Tennessee Quiz · Pink Horse Arcade</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scenery" aria-hidden="true">
      <div class="mountain back"></div>
      <div class="mountain front"></div>
      <div class="sun"></div>
      <div class="beam left"></div>
      <div class="beam right"></div>
    </div>
    <header>
      <a href="/arcade/">← Pink Horse Arcade</a
      ><span class="on-air">● LIVE FROM THE SMOKIES</span
      ><button id="sound" aria-pressed="false">♪ Sound off</button>
    </header>
    <main class="stage">
      <aside class="host">
        <div class="host-stars" aria-hidden="true">✦</div>
        <img
          src="assets/dolly.png"
          alt="Cartoon Dolly Parton in a pink rhinestone suit holding a golden microphone"
        />
        <div class="speech" id="speech" aria-live="polite">
          Big hair. Big heart. Big Tennessee trivia!
        </div>
        <a
          id="host-source"
          class="host-source"
          hidden
          target="_blank"
          rel="noopener noreferrer"
        ></a>
        <span class="host-label">YOUR HOST, DOLLY</span>
        <div class="voice-controls">
          <button id="repeat-voice" class="secondary">↻ Listen again</button
          ><span id="voice-status" aria-live="polite"
            >Turn sound on to hear the mountain host</span
          >
        </div>
      </aside>
      <section class="show" id="show" aria-label="Trivia show"></section>
    </main>
    <footer>
      Made with mountain love & a whole lot of rhinestones.
      <span
        >Unofficial tribute · AI Southern character voice · Original dialogue &
        sourced Dolly quips</span
      >
    </footer>
    <div id="confetti" aria-hidden="true"></div>
    <script src="data.js"></script>
    <script src="host.js"></script>
    <script src="voice-manifest.js"></script>
    <audio id="narration" preload="none"></audio>
    <script src="voice.js"></script>
    <script src="game.js"></script>
    <script>
      window.ARCADE_CONTROLS = {
        disableTouch: true,
        buttons: [
          { label: "A", keys: "1" },
          { label: "B", keys: "2" },
          { label: "X", keys: "3" },
          { label: "Y", keys: "4" },
        ],
      };
    </script>
    <script src="/arcade/controls.js" defer></script>
  </body>
</html>
