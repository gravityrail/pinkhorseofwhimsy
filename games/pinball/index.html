<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Pinball — Pink Horse Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #050510;
      font-family: "Courier New", ui-monospace, monospace;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; width: 100%; height: 100%; }

    /* HUD */
    #hud {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      text-shadow: 0 2px 12px #000, 0 0 20px rgba(255, 80, 200, 0.35);
    }
    #hud.ready { opacity: 1; }
    #hud .score {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 800;
      color: #e8ffe8;
      letter-spacing: 0.06em;
    }
    #hud .meta {
      margin-top: 2px;
      font-size: clamp(0.7rem, 2vw, 0.9rem);
      color: #7dffb8;
      letter-spacing: 0.12em;
    }

    /* Huge touch flippers + plunger */
    #touch-ui {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    #touch-ui.ready { opacity: 1; }

    .flip {
      pointer-events: auto;
      position: absolute;
      bottom: max(12px, env(safe-area-inset-bottom));
      width: min(42vw, 220px);
      height: min(22vh, 160px);
      border: none;
      border-radius: 28px;
      color: #fff;
      font: 800 clamp(1.4rem, 5vw, 2.2rem) system-ui, sans-serif;
      letter-spacing: 0.04em;
      background: linear-gradient(160deg, rgba(255,60,100,0.55), rgba(80,20,40,0.5));
      box-shadow:
        0 8px 28px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.25),
        0 0 24px rgba(255,40,120,0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.06s, background 0.1s, box-shadow 0.1s;
    }
    .flip:active, .flip.on {
      transform: scale(0.94);
      background: linear-gradient(160deg, rgba(255,120,160,0.85), rgba(180,40,80,0.75));
      box-shadow: 0 4px 16px rgba(0,0,0,0.4), 0 0 40px rgba(255,80,160,0.55);
    }
    #btn-flip-l { left: max(10px, env(safe-area-inset-left)); }
    #btn-flip-r { right: max(10px, env(safe-area-inset-right)); }

    #btn-plunge {
      pointer-events: auto;
      position: absolute;
      right: max(10px, env(safe-area-inset-right));
      bottom: calc(min(22vh, 160px) + max(20px, env(safe-area-inset-bottom)));
      width: min(28vw, 140px);
      height: min(14vh, 96px);
      border: none;
      border-radius: 20px;
      color: #fff;
      font: 800 clamp(0.85rem, 2.8vw, 1.15rem) system-ui, sans-serif;
      letter-spacing: 0.08em;
      background: linear-gradient(160deg, rgba(80,160,255,0.55), rgba(20,40,90,0.55));
      box-shadow: 0 6px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.22);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-plunge:active, #btn-plunge.on {
      transform: scale(0.95);
      background: linear-gradient(160deg, rgba(120,190,255,0.85), rgba(40,80,180,0.75));
    }

    #plunge-wrap {
      pointer-events: none;
      position: absolute;
      right: max(10px, env(safe-area-inset-right));
      bottom: calc(min(22vh, 160px) + min(14vh, 96px) + max(28px, env(safe-area-inset-bottom)));
      width: min(28vw, 140px);
      height: 10px;
      border-radius: 6px;
      background: rgba(0,0,0,0.45);
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    }
    #plunge-meter {
      display: block;
      width: 100%;
      height: 100%;
      transform-origin: left center;
      transform: scaleX(0);
      background: linear-gradient(90deg, #44ffaa, #ffee55, #ff4466);
      border-radius: 6px;
      transition: transform 0.05s linear;
    }

    #btn-coin {
      pointer-events: auto;
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      padding: 12px 18px;
      border: none;
      border-radius: 14px;
      color: #1a1000;
      font: 800 0.95rem system-ui, sans-serif;
      letter-spacing: 0.1em;
      background: linear-gradient(160deg, #ffe066, #ffaa22);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4), 0 0 20px rgba(255,200,40,0.35);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-coin:active { transform: scale(0.95); }

    .hint {
      pointer-events: none;
      position: absolute;
      left: 50%;
      bottom: calc(min(22vh, 160px) + max(18px, env(safe-area-inset-bottom)));
      transform: translateX(-50%);
      color: rgba(255,255,255,0.55);
      font-size: clamp(0.65rem, 1.8vw, 0.8rem);
      letter-spacing: 0.14em;
      text-align: center;
      text-shadow: 0 2px 8px #000;
    }

    /* Desktop: still show big buttons if coarse pointer OR always soft-visible */
    @media (hover: hover) and (pointer: fine) {
      .flip, #btn-plunge {
        opacity: 0.35;
      }
      .flip:hover, #btn-plunge:hover, .flip.on, #btn-plunge.on {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div class="score">0</div>
    <div class="meta">INSERT COIN</div>
  </div>

  <div id="touch-ui">
    <button type="button" class="flip" id="btn-flip-l" aria-label="Left flipper">◀ FLIP</button>
    <button type="button" class="flip" id="btn-flip-r" aria-label="Right flipper">FLIP ▶</button>
    <button type="button" id="btn-plunge" aria-label="Plunger — hold to charge">HOLD<br/>PLUNGE</button>
    <div id="plunge-wrap"><span id="plunge-meter"></span></div>
    <button type="button" id="btn-coin" aria-label="Insert coin">● COIN</button>
    <div class="hint">Z / X FLIP · HOLD M PLUNGE · 1 COIN</div>
  </div>

  <!-- Physics + render (globals) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

  <!-- Gamepad still via shared shim; custom huge touch UI replaces default pad -->
  <script>
    window.ARCADE_CONTROLS = {
      disableTouch: true,
      dpad: { left: 'z', right: 'x', up: 'm', down: 'm' },
      buttons: [
        { label: '◀', keys: 'z' },
        { label: '▶', keys: 'x' },
        { label: 'Plunge', keys: 'm' },
        { label: 'Coin', keys: '1' },
      ],
      start: '1',
    };
  </script>
  <script src="/arcade/controls.js" defer></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
