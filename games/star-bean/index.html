<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#02030a" />
    <title>Star Bean: TigerTron Rising</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Display + body fonts (previously supplied by next/font in the original app). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Pink Horse Arcade universal controls (gamepad support). The game has its own
         pointer/touch controls, so the on-screen touch overlay is disabled. Injected at
         runtime so the root-absolute path survives Vite's base rewriting. -->
    <script type="module">
      window.ARCADE_CONTROLS = {
        disableTouch: true,
        buttons: [
          { label: 'Fire', keys: ' ' },     // gamepad A
          { label: 'Bomb', keys: 'Shift' }, // gamepad B
          { label: 'Fire', keys: ' ' },     // gamepad X
          { label: 'Bomb', keys: 'Shift' }, // gamepad Y
        ],
        select: 'Escape',
      };
      const s = document.createElement('script');
      s.src = '/arcade/controls.js';
      s.defer = true;
      document.body.appendChild(s);
    </script>
  </body>
</html>
