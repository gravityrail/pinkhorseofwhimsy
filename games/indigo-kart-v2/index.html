<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#12101f" />
    <title>Indigo Kart v2</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- Pink Horse Arcade universal controls (gamepad). The game has its own
         touch UI, so the on-screen overlay is disabled. Injected at runtime so
         the root-absolute path survives Vite's base rewriting. -->
    <script type="module">
      window.ARCADE_CONTROLS = { disableTouch: true };
      const s = document.createElement('script');
      s.src = '/arcade/controls.js';
      s.defer = true;
      document.body.appendChild(s);
    </script>
  </body>
</html>
